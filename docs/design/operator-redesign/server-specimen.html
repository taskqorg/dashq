<section id="dq-server-study" aria-label="Server component study">
<style>
#dq-server-study{--ds-surface:light-dark(#fafbfc,#252b32);--ds-text:light-dark(#243039,#eef2f5);--ds-secondary:light-dark(#59636e,#b9c3cd);--ds-line:light-dark(#dce0e5,#46505b);--ds-soft:light-dark(#e9edf1,#37424c);--ds-ok:light-dark(#246f59,#8dd2b8);--ds-warn:light-dark(#955525,#edbc96);--ds-warn-fill:light-dark(#faf0e6,#3e332c);--ds-font:16px;max-width:736px;color-scheme:light dark;color:var(--ds-text);font:400 var(--ds-font)/1.4 system-ui,sans-serif;container-type:inline-size}
#dq-server-study *{box-sizing:border-box}#dq-server-study .ds-caption{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--ds-secondary);font-size:.85em;margin:0 0 12px;padding-right:90px}#dq-server-study .ds-stage{padding:16px;border-radius:18px}#dq-server-study .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14em),1fr));gap:12px;align-items:start}#dq-server-study article{background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:14px;padding:16px;min-width:0;overflow-wrap:anywhere}#dq-server-study button{font:inherit;color:inherit;cursor:default}#dq-server-study button:focus-visible{outline:2px solid var(--ds-text);outline-offset:3px}#dq-server-study svg:not(.ds-spark){width:18px;height:18px;flex-shrink:0;stroke-width:1.7}#dq-server-study .ds-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}#dq-server-study .ds-machine{width:36px;height:36px;display:grid;place-items:center;background:var(--ds-soft);border-radius:10px;flex-shrink:0}#dq-server-study .ds-machine svg{width:20px;height:20px}#dq-server-study .ds-name{font-size:1.125em;font-weight:500;margin:0}#dq-server-study .ds-age{font-size:.85em;color:var(--ds-secondary);display:flex;gap:4px;align-items:center}#dq-server-study .ds-age svg{width:12px;height:12px}#dq-server-study .ds-state{display:flex;align-items:center;gap:6px;font-size:.85em;min-height:24px;margin-bottom:14px}#dq-server-study .ds-good{color:var(--ds-ok)}#dq-server-study .ds-warning{color:var(--ds-warn)}#dq-server-study .ds-quiet{color:var(--ds-secondary)}#dq-server-study .ds-metrics{display:grid;gap:12px;min-height:156px}#dq-server-study .ds-metric{display:block;width:100%;background:none;border:0;padding:0;text-align:left;border-radius:5px}#dq-server-study .ds-metric-top{display:flex;align-items:center;justify-content:space-between;gap:10px}#dq-server-study .ds-number{font-variant-numeric:tabular-nums;white-space:nowrap}#dq-server-study .ds-unit{font-size:.85em;color:var(--ds-secondary)}#dq-server-study .ds-track{display:block;height:4px;background:var(--ds-soft);border-radius:2px;margin:6px 0 0 28px;overflow:hidden}#dq-server-study .ds-track span{display:block;height:100%;background:var(--ds-secondary);border-radius:2px}#dq-server-study .ds-metric.ds-alert{background:var(--ds-warn-fill);padding:7px 8px;margin:-7px -8px;width:calc(100% + 16px);color:var(--ds-warn);border-radius:7px}#dq-server-study .ds-alert .ds-track span{background:var(--ds-warn)}#dq-server-study .ds-empty{min-height:156px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ds-secondary)}#dq-server-study .ds-empty svg{height:30px;width:30px}#dq-server-study .ds-empty span{font-size:.85em}#dq-server-study .ds-open{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:16px;padding:7px 8px;min-height:36px;background:var(--ds-soft);border:0;border-radius:7px;font-size:.9em;font-weight:500}#dq-server-study .ds-open.ds-primary{background:var(--ds-warn-fill);color:var(--ds-warn)}#dq-server-study .ds-back{display:flex;align-items:center;gap:4px;min-height:32px;background:none;border:0;padding:0;margin-bottom:12px;color:var(--ds-secondary);font-size:.85em}#dq-server-study .ds-detail-name{display:flex;align-items:center;gap:8px;font-weight:500;margin-bottom:8px}#dq-server-study .ds-detail-value{font-size:2em;font-weight:500;font-variant-numeric:tabular-nums;margin:6px 0 0}#dq-server-study .ds-detail-sub{font-size:.85em;color:var(--ds-secondary);margin:0 0 16px}#dq-server-study dl{margin:16px 0 0;display:grid;gap:8px}#dq-server-study dl>div{display:flex;gap:8px;justify-content:space-between;font-size:.85em}#dq-server-study dt{color:var(--ds-secondary)}#dq-server-study dd{margin:0;text-align:right}#dq-server-study .ds-note{font-size:.85em;margin:12px 0 0;color:var(--ds-secondary)}#dq-server-study details{font-size:.85em;border-top:1px solid var(--ds-line);padding-top:12px;margin-top:16px}#dq-server-study summary{min-height:32px;color:var(--ds-secondary)}#dq-server-study .ds-evidence{display:grid;gap:6px;margin:4px 0 0;overflow-wrap:anywhere}
@container(max-width:620px){#dq-server-study .ds-grid{grid-template-columns:1fr}#dq-server-study .ds-stage{padding:12px}#dq-server-study article{max-width:340px;width:100%;justify-self:center}}
@media(pointer:coarse){#dq-server-study .ds-metric,#dq-server-study .ds-open,#dq-server-study .ds-back,#dq-server-study summary{min-height:44px}}
#dq-server-study .ds-metric-body{display:grid;grid-template-columns:minmax(0,1fr) 64px;align-items:center;gap:10px}#dq-server-study .ds-current{min-width:0}#dq-server-study .ds-metric-top{gap:6px}#dq-server-study .ds-history{display:block;width:64px;height:36px}#dq-server-study .ds-spark{display:block;width:64px;height:36px;overflow:visible;stroke-width:1.7}#dq-server-study .ds-period{display:block;text-align:right;color:var(--ds-secondary);font-size:.85em;margin:-6px 0 10px}#dq-server-study .ds-track{margin-left:0}
</style>
<div class="ds-caption"><span>One server · three states</span><span>Illustrative data</span></div>
<div class="ds-stage"><div class="ds-grid" data-cards></div></div>
</section>
<script>
{
 const root=document.getElementById('dq-server-study');
 const saved=window.openai?.widgetState?.privateContent;
 const panels={};
 const ui={font:16};
 const samples=[
  {id:'normal',label:'Resource data unavailable',icon:'circle-help',tone:'ds-quiet',age:'TaskQ observed 12s ago',resourcesMissing:true,cpu:28,ram:6.2,disk:42,action:'Source details'},
  {id:'warning',label:'Low disk space',icon:'triangle-alert',tone:'ds-warning',age:'12s ago',cpu:28,ram:6.2,disk:92,action:'Inspect disk'},
  {id:'stale',label:'No recent data',icon:'clock-3',tone:'ds-quiet',age:'26m ago',action:'Connection'}
 ];
 const histories={normal:{cpu:[61,43,null,41,30,25,28],ram:[43,44,41,40,42,39,38.75],disk:[62,58,56,52,47,45,42]},warning:{cpu:[18,31,21,28,24,30,28],ram:[24,27,31,34,36,37,38.75],disk:[42,48,57,67,78,86,92]}};
 const views=['overview','host','cpu','ram','disk','connection'];
 if(saved?.v===1)for(const s of samples)if(views.includes(saved.panels?.[s.id]))panels[s.id]=saved.panels[s.id];
 const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 function sparkPath(values){
  let joined=false;
  return values.map((v,i)=>{if(!Number.isFinite(v)||v<0||v>100){joined=false;return '';}const point=`${(3+58*i/Math.max(1,values.length-1)).toFixed(1)},${(33-30*v/100).toFixed(1)}`;const command=(joined?'L':'M')+point;joined=true;return command;}).join('');
 }
 function spark(s,type,name){
  const values=histories[s.id][type],first=values.find(Number.isFinite),last=values.at(-1),delta=last-first;
  const tone=type==='disk'?(s.id==='warning'?'ds-warning':delta<0?'ds-good':'ds-quiet'):'ds-quiet';
  const description=`${name} · last 30 minutes · 0–100% · ${first}% to ${last}% (${delta>0?'+':''}${Number(delta.toFixed(1))} pp)${values.some(v=>v===null)?' · missing sample':''}`;
  return `<span class="ds-history ${tone}"><svg class="ds-spark" viewBox="0 0 64 36" role="img" aria-label="${description}" data-tooltip="${description}"><title>${description}</title><path d="${sparkPath(values)}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>${Number.isFinite(last)?`<circle cx="61" cy="${33-30*last/100}" r="2" fill="currentColor"/>`:''}</svg></span>`;
 }
 function metric(s,type,name,value,percent){return `<button class="ds-metric ${s.id==='warning'&&type==='disk'?'ds-alert':''}" data-id="${s.id}" data-view="${type}" aria-label="${name}: ${value.replace(/<[^>]*>/g,'')}. Open details" data-tooltip="${name}"><span class="ds-metric-body"><span class="ds-current"><span class="ds-metric-top">${icon(type==='cpu'?'cpu':type==='ram'?'memory-stick':'hard-drive')}<span class="ds-number">${value}</span></span><span class="ds-track" aria-hidden="true"><span style="width:${percent}%"></span></span></span>${spark(s,type,name)}</span></button>`}

 function overview(s){return `<div class="ds-state ${s.tone}">${icon(s.icon)}<span>${s.label}</span></div><span class="ds-period" aria-hidden="${s.id==='stale'?'true':'false'}">${s.id==='stale'?'&nbsp;':'Last 30 minutes'}</span>${s.id==='stale'||s.resourcesMissing?`<div class="ds-empty" role="img" aria-label="Current metrics unavailable">${icon('circle-help')}<span>CPU · memory · disk unavailable</span></div>`:`<div class="ds-metrics">${metric(s,'cpu','CPU','28<span class="ds-unit">%</span>',28)}${metric(s,'ram','Memory','6.2 <span class="ds-unit">/ 16 GiB</span>',38.75)}${metric(s,'disk','Root disk',`${s.disk} <span class="ds-unit">/ 100 GiB</span>`,s.disk)}</div>`}<button class="ds-open ${s.id==='warning'?'ds-primary':''}" data-id="${s.id}" data-view="${s.id==='warning'?'disk':s.id==='stale'?'connection':'host'}">${icon(s.id==='warning'?'hard-drive':s.id==='stale'?'plug-zap':'arrow-up-right')}${s.action}</button>`}
 function detail(s,type){
  const data={host:{name:'FRA',icon:'server',value:'Partial',sub:'TaskQ presence observed; resources unavailable',rows:[['Observed',s.age],['Resource source','Not established']]},cpu:{name:'CPU',icon:'cpu',value:s.id==='stale'?'—':'28%',sub:'Current utilization',rows:[['Observed',s.age],['Source','AgentQ']]},ram:{name:'Memory',icon:'memory-stick',value:'6.2 GiB',sub:'of 16 GiB used',rows:[['Available','9.8 GiB'],['Observed',s.age]]},disk:{name:'Root disk',icon:'hard-drive',value:`${s.disk}%`,sub:`${s.disk} of 100 GiB used`,rows:[['Free',`${100-s.disk} GiB`],['Finding',s.id==='warning'?'Separate producer finding':'None reported'],['Observed',s.age]]},connection:{name:'Connection',icon:'unplug',value:'Unknown',sub:'Last observation 26 minutes ago',rows:[['TaskQ heartbeat','Expired'],['Physical host','Not established'],['Current resources','Unavailable']]}}[type];
  return `<button class="ds-back" data-id="${s.id}" data-view="overview">${icon('arrow-left')}FRA</button><div class="ds-detail-name">${icon(data.icon)}${data.name}</div><div class="ds-detail-value ${s.id==='warning'&&type==='disk'?'ds-warning':''}">${data.value}</div><p class="ds-detail-sub">${data.sub}</p><dl>${data.rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>${s.id==='warning'&&type==='disk'?'<p class="ds-note">Inspect disk usage before choosing a cleanup action.</p>':''}<details><summary>Evidence</summary><div class="ds-evidence"><span>${type==='host'?'TaskQ presence is separate from resource and service health. Resource data is not established in this example.':s.id==='stale'?'No fresh producer observation. Silence does not establish an offline host.':type==='disk'&&s.id==='warning'?'ServerQ · open disk-space finding. The sample includes a producer finding; 92% is not a new policy threshold.':'AgentQ · timestamped resource sample. A resource reading does not establish overall host health.'}</span><span>Fixture · no live connection</span></div></details>`;
 }
 function render(){
  root.style.setProperty('--ds-font',ui.font+'px');
  root.querySelector('[data-cards]').innerHTML=samples.map(s=>{const view=panels[s.id]||'overview';return `<article aria-label="FRA · ${s.label}" data-scenario="${s.id}">${view==='overview'?`<div class="ds-header"><span class="ds-machine">${icon('server')}</span><div><h3 class="ds-name">FRA</h3><div class="ds-age">${icon('clock-3')}${s.age}</div></div></div>${overview(s)}`:detail(s,view)}</article>`}).join('');
  if(globalThis.lucide)lucide.createIcons({root,attrs:{width:18,height:18}});
 }
 root.addEventListener('click',e=>{
  const button=e.target.closest('button[data-view]');if(!button)return;
  const id=button.dataset.id,view=button.dataset.view;
  if(!samples.some(s=>s.id===id)||!views.includes(view))return;
  panels[id]=view;render();
  root.querySelector(`[data-scenario="${id}"] button`).focus({preventScroll:true});
  window.openai?.setWidgetState({modelContent:null,privateContent:{v:1,panels}})?.catch(()=>{});
 });
 window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(next?.v!==1)return;for(const s of samples)panels[s.id]=views.includes(next.panels?.[s.id])?next.panels[s.id]:'overview';render();});
 console.assert((sparkPath([0,null,100]).match(/M/g)||[]).length===2&&!sparkPath([0,null,100]).includes('L'),'Missing samples must break the line');
 console.assert(sparkPath([null,null])===''&&histories.normal.disk.at(-1)===samples[0].disk&&histories.warning.disk.at(-1)===samples[1].disk,'History must retain gaps and match current values');
 render();
 console.assert(root.querySelectorAll('article').length===3,'Three server states must render');
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(ui,'font',{label:'Text size',min:16,max:20,step:2,unit:'px'});}
}
</script>
