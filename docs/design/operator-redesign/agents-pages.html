<style>

:inherit;font:inherit;box-sizing:border-box}#dq-overview [data-agent-summary] .dq-person:hover{background:var(--dq-soft)}
@container(max-width:620px){#dq-overview .dq-agent-grid{grid-template-columns:1fr;gap:18px}#dq-overview .dq-agent-row{gap:10px;padding:12px 6px;grid-template-columns:minmax(0,1fr) 18px}#dq-overview .dq-agent-state{grid-row:2;grid-column:1;text-align:left;margin-left:30px}#dq-overview .dq-agent-state>span{justify-content:flex-start}#dq-overview .dq-agent-state small{display:block;margin:0;white-space:nowrap}#dq-overview .dq-agent-state>span{display:inline-flex;white-space:nowrap}#dq-overview .dq-agent-state{display:flex;flex-wrap:wrap;gap:4px 10px}#dq-overview .dq-agent-row>svg{grid-column:2;grid-row:1 / span 2}#dq-overview .dq-agent-events li{grid-template-columns:60px minmax(0,1fr)}}
