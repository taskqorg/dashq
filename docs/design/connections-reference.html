<div id="qconnect" aria-label="Service connections demo">
<style>
#qconnect{--paper:light-dark(#fafbfc,#252b32);--ink:light-dark(#243039,#eef2f5);--secondary:light-dark(#59636e,#b9c3cd);--line:light-dark(#dce0e5,#46505b);--hover:light-dark(#e9edf1,#37424c);--good:light-dark(#246f59,#8dd2b8);--ask:light-dark(#955525,#edbc96);font:16px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink)}
#qconnect *{box-sizing:border-box}#qconnect .surface{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px}#qconnect button,#qconnect input,#qconnect select{font:inherit;color:inherit}#qconnect button{border:0;background:transparent;border-radius:5px;padding:5px 7px;min-height:32px;text-align:left}#qconnect button:hover,#qconnect button[aria-pressed=true]{background:var(--hover)}#qconnect button.primary{background:var(--ink);color:var(--paper)}#qconnect button:disabled{opacity:.55}#qconnect select,#qconnect input{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:4px;max-width:100%}#qconnect :focus-visible{outline:2px solid var(--good);outline-offset:2px}#qconnect .line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#qconnect .spread{justify-content:space-between}#qconnect .push{margin-left:auto}#qconnect small,#qconnect .muted{color:var(--secondary)}#qconnect small{font-size:.875em}#qconnect strong,#qconnect h2{font-weight:500}#qconnect h2{font-size:1em;margin:0}#qconnect svg{display:inline-block;width:16px;height:16px;vertical-align:-3px}#qconnect p{margin:8px 0}#qconnect .good{color:var(--good)}#qconnect .ask{color:var(--ask)}#qconnect .top{padding-right:85px}#qconnect .grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);margin:8px 0}#qconnect .row{display:contents}#qconnect .cell{padding:8px 4px;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}#qconnect .cell small{display:block}#qconnect .cell button{padding:0}#qconnect .detail{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}#qconnect .panel{background:var(--hover);padding:10px;border-radius:6px;margin-top:10px}#qconnect code{font-size:.9em;overflow-wrap:anywhere;white-space:normal}#qconnect .facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 14px;margin:10px 0}#qconnect .steps{display:flex;gap:8px;flex-wrap:wrap;color:var(--secondary);margin:8px 0}#qconnect .steps .current{color:var(--ink)}#qconnect .demo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:14px}#qconnect .demo select{max-width:230px}#qconnect summary{min-height:32px}#qconnect [hidden]{display:none!important}#qconnect .code{font-size:1.2em;letter-spacing:.1em;font-variant-numeric:tabular-nums}#qconnect .compact{font-size:.875em}#qconnect .status{font-variant-numeric:tabular-nums}@media(max-width:500px){#qconnect .top{padding-right:0}#qconnect .grid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}#qconnect .data{grid-column:1/-1;padding-top:0}#qconnect .grid>.heading{display:none}#qconnect .facts{grid-template-columns:1fr;gap:2px}#qconnect .facts small:not(:first-child){margin-top:6px}}@media(pointer:coarse){#qconnect button,#qconnect summary,#qconnect select{min-height:44px}}
</style>
<div class="demo"><small>Demo · connection lifecycle</small><label>State <select data-scenario><option value="fresh">Connected</option><option value="lost">No contact</option><option value="stale">Fresh connection, old data</option><option value="export">Export delayed</option><option value="revoked">Revoked</option><option value="local">Disconnected locally</option><option value="identity">Reinstalled · new identity</option></select></label><label>Text <select data-font><option>16</option><option>20</option></select></label></div>
<section class="surface"><div class="line spread top"><h2><i data-lucide="plug" aria-hidden="true"></i> Connections</h2><button type="button" data-action="add"><i data-lucide="plus" aria-hidden="true"></i> Add service</button></div><small>Personal · demo owner</small><div data-list class="grid"></div><div data-detail></div><div data-setup></div><p data-notice role="status" aria-live="polite" class="muted compact"></p></section>
<script>
(()=>{const root=document.getElementById('qconnect');let s={v:1,selected:0,scenario:'fresh',font:16,setup:'',product:'AgentQ',reconnect:false,confirmed:false,generation:1,added:null};const products=['AgentQ','ServerQ','TaskQ'],scope={AgentQ:'Installation health, resource samples and allowlisted activity metadata',ServerQ:'Rule results, numeric evidence and incidents',TaskQ:'Canonical board snapshots within the declared project scope'};const names=['fra · native Linux','fra · native Linux','mac · native macOS'];const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;const btn=(a,t,primary=false)=>`<button type="button" data-action="${a}" ${primary?'class="primary"':''}>${t}</button>`;
function save(){window.openai?.setWidgetState({modelContent:{demo:true,service:products[s.selected],state:s.scenario,connectionStep:s.setup},privateContent:s})?.catch(()=>{})}
function restore(v){if(v?.v===1){s={...s,...v};if(!Number.isInteger(s.selected)||s.selected<0||s.selected>2)s.selected=0}}
function note(t){root.querySelector('[data-notice]').textContent=t}
function status(i){if(i!==s.selected)return ['check','Connected','good','Observed 35s ago'];return {fresh:['check','Connected','good','Observed 40s ago'],lost:['wifi-off','No contact','ask','Last observation 8m ago'],stale:['check','Connected','good','Data stale · 22m ago'],export:['check','Connected','good','Observed 40s ago'],revoked:['circle-slash','Revoked','muted','History retained · 1h ago'],local:['unplug','Disconnected locally','muted','Revocation pending'],identity:['circle-help','New installation','muted','No accepted data yet']}[s.scenario]}
function paint(){root.style.fontSize=s.font+'px';root.querySelector('[data-font]').value=s.font;root.querySelector('[data-scenario]').value=s.scenario;root.querySelector('[data-list]').innerHTML='<small class="cell heading">Installation</small><small class="cell heading">Connection</small><small class="cell heading">Data</small>'+products.map((p,i)=>{const x=status(i);return `<div class="row"><div class="cell"><button type="button" data-select="${i}" aria-pressed="${s.selected===i}"><strong>${p}</strong></button><small>${names[i]}</small></div><div class="cell ${x[2]}">${icon(x[0])} ${x[1]}</div><div class="cell data"><small>${x[3]}</small></div></div>`}).join('')+(s.added?`<div class="row"><div class="cell"><strong>${s.added.product}</strong><small>${s.added.host}</small></div><div class="cell good">${icon('check')} Connected</div><div class="cell data"><small>First snapshot verified · now</small></div></div>`:'');
const p=products[s.selected];let content='';
if(s.scenario==='fresh')content='<p>Latest snapshot visible · 40s ago</p><small>Connection confirmed by dashboard readback. Local work and checks continue independently.</small>';
if(s.scenario==='lost')content='<p class="ask">No contact for 8 minutes</p><p>Last observations stay visible with their age. Host activity is unknown; the dashboard cannot infer that the host stopped.</p><small>Automatic retry · no new browser approval. History gaps remain visible.</small><div class="line">'+btn('restore','Simulate network recovery')+'</div>';
if(s.scenario==='stale')content='<p class="ask">Delivery works · producer data is old</p><p>Received 10s ago; observed 22m ago. Retrying the connection does not make this observation fresh.</p><small>Show the last value with its age; a trend resumes only from real samples.</small>';
if(s.scenario==='export')content=p==='AgentQ'?'<p>Snapshots and charts available</p><p class="ask">Langfuse export delayed</p><small>Bounded export retry continues independently. Dashboard connection stays active.</small>':'<p>Snapshots available</p><small>This product does not require a Langfuse export. Other products remain independent.</small>';
if(s.scenario==='revoked')content='<p>Access revoked · generation '+s.generation+'</p><small>Local work continues. History remains; the old credential cannot reconnect.</small><div class="line">'+btn('reconnect','Reconnect',true)+'</div>';
if(s.scenario==='local')content='<p>Sending stopped on the host</p><p class="ask">Server revocation not yet confirmed</p><small>A bounded revoke-only request retries when reachable. Local sending stays off.</small><div class="line">'+btn('revoke-arrives','Simulate revocation acknowledgement')+'</div>';
if(s.scenario==='identity')content='<p class="ask">Same label, different installation</p><p>The old installation and its history remain separate. Nothing is merged by hostname.</p><small>New installation: demo-b92f · previous: demo-a17c. Browser approval is required.</small><div class="line">'+btn('reconnect','Connect new installation',true)+'</div>';
root.querySelector('[data-detail]').innerHTML=`<div class="detail"><div class="line spread"><strong>${p} · ${names[s.selected]}</strong>${!['revoked','local','identity'].includes(s.scenario)?btn('revoke',icon('circle-slash')+' Revoke'):''}</div>${content}<details><summary>Identity & scope</summary><div class="facts"><small>Installation</small><span>${s.scenario==='identity'?'demo-b92f':'demo-a17c-'+s.selected}</span><small>Generation</small><span>${s.generation}</span><small>Scope</small><span>${scope[p]}</span><small>Authority</small><span>Observation only</span></div><small>Task actions and host policy changes require separate capabilities.</small></details></div>`;
let setup='';if(s.setup==='revoke')setup=`<div class="panel"><strong>Revoke ${p} · ${names[s.selected]}?</strong><p>Stop accepting this installation's data. Keep history and local work. Reconnection needs a new approval.</p><div class="line">${btn('confirm-revoke','Revoke this connection',true)}${btn('cancel','Cancel')}</div></div>`;
else if(s.setup){const step=s.setup;setup=`<div class="detail"><div class="line spread"><strong>${s.reconnect?'Reconnect':'Connect service'}</strong>${['host','approve'].includes(step)?btn('cancel','Cancel'):''}</div><div class="steps"><span class="${step==='host'?'current':''}">1 · Host</span><span class="${step==='approve'?'current':''}">2 · Approve</span><span class="${step==='verify'?'current':''}">3 · Verify</span></div>`;
if(step==='host')setup+=`<label>Product <select data-product ${s.reconnect?'disabled':''}>${products.map(x=>`<option ${s.product===x?'selected':''}>${x}</option>`).join('')}</select></label><div class="panel"><small>Run on the existing installation · illustrative command</small><p><code>${s.product.toLowerCase()} enroll https://dash.example.test</code></p><small>Uses the existing service. A headless host prints the same approval link and code.</small></div><div class="line">${btn('host-ready','Simulate host command',true)}</div>`;
if(step==='approve')setup+=`<div class="panel"><small>Browser approval · https://dash.example.test</small><p><strong>${s.product} · ${s.reconnect?names[s.selected]:'lab · native Linux'}</strong></p><div class="facts"><small>Account / workspace</small><span>Demo owner / Personal</span><small>Matching host code</small><span class="code">K7MP–3D8R</span><small>Expires</small><span>In 10 minutes</span><small>Requested data</small><span>${scope[s.product]}</span></div><p>Observation only · no task actions or host commands</p>${s.reconnect?'<small>New credential; old credential remains invalid. Preserve existing identity/history when available.</small>':''}<label><input type="checkbox" data-match ${s.confirmed?'checked':''}> Code matches the host</label><div class="line">${btn('approve','Approve connection',true)}${btn('cancel','Deny')}</div></div>`;
if(step==='verify')setup+=`<div class="panel"><strong>Approved · waiting for first snapshot</strong><p>Credential installed. Connection is not yet verified.</p><div class="facts"><small>Stored</small><span>Waiting</span><small>Dashboard readback</small><span>Waiting</span></div><small>Resource warmup and empty history will remain explicit.</small></div><div class="line">${btn('projected','Simulate verified snapshot',true)}${btn('timeout','Simulate timeout')}</div>`;
if(step==='timeout')setup+=`<div class="panel"><strong class="ask">Approved · readback not confirmed</strong><p>Bounded recovery continues with the same connection. Do not approve another grant.</p><small>No snapshot is claimed visible until the dashboard projection confirms it.</small></div><div class="line">${btn('projected','Simulate recovered readback',true)}</div>`;
if(step==='complete')setup+=`<div class="panel"><strong class="good">${icon('check')} Connected · ${s.product}</strong><p>First snapshot stored and visible in the dashboard.</p><small>${s.product==='AgentQ'?'CPU warming up · no history yet. Trends need 3 real samples.':s.product==='ServerQ'?'Rules available; unsupported and unknown checks remain explicit.':'Canonical board snapshot available; action capabilities remain separate.'}</small><p><small>${s.added?'New installation retained separately from previous history.':'Existing identity and history preserved.'}</small></p></div>${btn('close-complete','Close')}`;setup+='</div>'}
root.querySelector('[data-setup]').innerHTML=setup;const approve=root.querySelector('[data-action="approve"]');if(approve)approve.disabled=!s.confirmed;root.querySelectorAll('button,summary,select').forEach(e=>e.classList.add('cursor-interaction'));globalThis.lucide?.createIcons({attrs:{width:16,height:16}})}
restore(window.openai?.widgetState?.privateContent);paint();
root.addEventListener('change',e=>{if(e.target.matches('[data-font]'))s.font=+e.target.value;else if(e.target.matches('[data-scenario]')){s.scenario=e.target.value;s.setup='';note('')}else if(e.target.matches('[data-product]'))s.product=e.target.value;else if(e.target.matches('[data-match]'))s.confirmed=e.target.checked;else return;paint();save()});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.select!==undefined){s.selected=+b.dataset.select;s.scenario='fresh';s.setup='';paint();save();return}switch(b.dataset.action){case 'add':s.setup='host';s.product='AgentQ';s.reconnect=false;break;case 'host-ready':s.setup='approve';s.confirmed=false;break;case 'approve':if(!s.confirmed)return;s.setup='verify';break;case 'timeout':s.setup='timeout';break;case 'projected':if(s.reconnect&&s.scenario!=='identity'){s.generation++;s.scenario='fresh';note('Demo: same installation/history; new generation verified.')}else{s.added={product:s.product,host:s.reconnect?names[s.selected]:'lab · native Linux',id:s.reconnect?'demo-b92f':'demo-lab'};if(s.reconnect)s.scenario='lost';note('Demo: new installation visible; previous history is separate.')}s.setup='complete';break;case 'close-complete':s.setup='';note('');break;case 'restore':s.scenario='fresh';note('Demo: network recovered automatically with the existing grant; no duplicate installation.');break;case 'revoke':s.setup='revoke';break;case 'confirm-revoke':s.scenario='revoked';s.setup='';note('Demo: server revocation acknowledged.');break;case 'reconnect':s.product=products[s.selected];s.reconnect=true;s.setup='host';break;case 'revoke-arrives':s.scenario='revoked';note('Demo: server revocation acknowledged; sending remains off.');break;case 'cancel':s.setup='';s.confirmed=false;note('No new active grant created.');break;default:return}paint();save()});
window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.privateContent;if(v?.v===1&&JSON.stringify(v)!==JSON.stringify(s)){restore(v);paint()}});
})();
</script>
</div>
