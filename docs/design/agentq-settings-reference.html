<div id="aqsettings" aria-label="AgentQ integrations proposal">
<style>
#aqsettings{--paper:light-dark(#fafbfc,#252b32);--ink:light-dark(#243039,#eef2f5);--secondary:light-dark(#59636e,#b9c3cd);--line:light-dark(#dce0e5,#46505b);--hover:light-dark(#e9edf1,#37424c);--good:light-dark(#246f59,#8dd2b8);--ask:light-dark(#955525,#edbc96);font:16px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink)}#aqsettings *{box-sizing:border-box}#aqsettings .surface{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px}#aqsettings .line{display:flex;align-items:center;flex-wrap:wrap;gap:8px}#aqsettings .spread{justify-content:space-between}#aqsettings .push{margin-left:auto}#aqsettings h2,#aqsettings strong{font-weight:500}#aqsettings h2{font-size:1em;margin:0}#aqsettings p{margin:7px 0}#aqsettings small,#aqsettings .muted{color:var(--secondary)}#aqsettings small{font-size:.875em}#aqsettings svg{display:inline-block;width:16px;height:16px;vertical-align:-3px}#aqsettings .good{color:var(--good)}#aqsettings .ask{color:var(--ask)}#aqsettings button,#aqsettings select,#aqsettings input{font:inherit;color:inherit}#aqsettings button{background:transparent;border:0;border-radius:5px;min-height:32px;padding:4px 7px;text-align:left}#aqsettings button:hover,#aqsettings button[aria-pressed=true]{background:var(--hover)}#aqsettings button.primary{background:var(--ink);color:var(--paper)}#aqsettings button:disabled{opacity:.55}#aqsettings select{max-width:100%;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:4px}#aqsettings :focus-visible{outline:2px solid var(--good);outline-offset:2px}#aqsettings .demo{font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}#aqsettings .demo select{max-width:220px}#aqsettings .grid{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));margin-top:10px}#aqsettings .cell{min-width:0;border-bottom:1px solid var(--line);padding:7px 4px;overflow-wrap:anywhere}#aqsettings .cell small{display:block}#aqsettings .cell button{padding:0}#aqsettings .columns{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;margin-top:14px}#aqsettings .section{border-top:1px solid var(--line);margin-top:12px;padding-top:9px}#aqsettings .fact{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:start;margin:7px 0}#aqsettings .fact span:last-child{text-align:right}#aqsettings .review{border:1px solid var(--line);border-radius:6px;padding:9px;margin:8px 0}#aqsettings .review p{overflow-wrap:anywhere}#aqsettings .num{font-variant-numeric:tabular-nums}#aqsettings .chips{display:flex;gap:5px;flex-wrap:wrap}#aqsettings .chip{background:var(--hover);border-radius:4px;padding:2px 5px;font-size:.875em}#aqsettings .small-label{font-size:.875em;color:var(--secondary)}#aqsettings summary{min-height:32px}#aqsettings [hidden]{display:none!important}#aqsettings .top{padding-right:85px}#aqsettings .stack{display:flex;flex-direction:column;gap:6px}#aqsettings .label-mobile{display:none}@media(max-width:600px){#aqsettings .columns{grid-template-columns:1fr;gap:12px}#aqsettings .grid{grid-template-columns:repeat(3,minmax(0,1fr))}#aqsettings .client{grid-column:1/-1;padding-bottom:3px;border-bottom:0}#aqsettings .heading{display:none}#aqsettings .label-mobile{display:block;font-size:.85em;color:var(--secondary)}#aqsettings .top{padding-right:0}#aqsettings .fact{grid-template-columns:1fr}#aqsettings .fact span:last-child{text-align:left}}@media(pointer:coarse){#aqsettings button,#aqsettings summary,#aqsettings select{min-height:44px}}
</style>
<div class="demo"><small>Demo · AgentQ configuration proposal</small><label>Access <select data-access><option value="allowed">Configuration allowed</option><option value="read">Observation only</option><option value="stale">Stale snapshot</option><option value="conflict">Foreign config conflict</option></select></label><label>Text <select data-font><option>16</option><option>20</option></select></label></div>
<section class="surface"><div class="line spread top"><h2><i data-lucide="sliders-horizontal" aria-hidden="true"></i> Agent integrations</h2><small data-age>4 profiles · demo</small></div><div class="grid" data-clients></div><small class="small-label">✓ Configured · client activity verified separately</small><div data-editor></div><div class="line section"><small>AgentQ owns integrations. Client login, model and approval policy stay with the client.</small></div><p data-notice class="muted" role="status" aria-live="polite"></p></section>
<script>
(()=>{const root=document.getElementById('aqsettings'),icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`,btn=(a,t,primary=false)=>`<button type="button" data-action="${a}" ${primary?'class="primary"':''}>${t}</button>`;
const clients=[{name:'Codex',host:'mac · native',profile:'Default',route:'Direct',opt:true,mcp:true,hooks:true,verified:false,adapter:'Provider · tool results',cap:true},{name:'Claude Code',host:'fra · native',profile:'Work',route:'AgentQ',opt:true,mcp:true,hooks:true,verified:true,adapter:'PreToolUse → qualified commands',cap:true},{name:'Hermes',host:'fra · native',profile:'Default',route:'Native',opt:true,mcp:true,hooks:false,verified:false,adapter:'transform_tool_result → terminal',cap:false},{name:'Claude Desktop Chat',host:'mac · native',profile:'Default',route:'Not applicable',opt:false,mcp:true,hooks:false,verified:true,adapter:'MCP only',cap:false}];
let s={v:2,selected:0,font:16,access:'allowed',drafts:clients.map(c=>({route:c.route,opt:c.opt,setup:false})),states:clients.map(()=>''),actual:clients.map(c=>({...c})),activity:clients.map(c=>c.verified)};
function save(){window.openai?.setWidgetState({modelContent:{demo:true,client:clients[s.selected].name,host:clients[s.selected].host,draft:s.drafts[s.selected],phase:s.states[s.selected]},privateContent:s})?.catch(()=>{})}
function restore(v){if(v?.v===2&&Array.isArray(v.actual)&&v.actual.length===4)s={...s,...v}}
function note(t){root.querySelector('[data-notice]').textContent=t}
function paint(){root.style.fontSize=s.font+'px';root.querySelector('[data-font]').value=s.font;root.querySelector('[data-access]').value=s.access;root.querySelector('[data-age]').textContent=s.access==='stale'?'Snapshot 12m old':'4 profiles · observed 40s ago';root.querySelector('[data-clients]').innerHTML='<small class="cell heading">Client / profile</small><small class="cell heading">Routing</small><small class="cell heading">MCP / hooks</small><small class="cell heading">Optimization</small>'+s.actual.map((c,i)=>`<div class="cell client"><button type="button" data-client="${i}" aria-pressed="${i===s.selected}"><strong>${c.name}</strong></button><small>${c.host} · ${c.profile}</small></div><div class="cell"><span class="label-mobile">Routing</span>${c.route}</div><div class="cell"><span class="label-mobile">MCP / hooks</span><span>${c.mcp?'✓':'?'} / ${i===3?'—':c.hooks?'✓':'?'}</span></div><div class="cell"><span class="label-mobile">Optimize</span>${i===3?'—':!c.opt?'Off':i===0&&c.route==='Direct'?'Bypassed':c.hooks||i===0?'On':'Unverified'}</div>`).join('');
const i=s.selected,c=s.actual[i],d=s.drafts[i],phase=s.states[i],chat=i===3,denied=s.access!=='allowed',changed=d.route!==c.route||d.opt!==c.opt||d.setup;let warning={allowed:'',read:'Observation grant only. Configuration requires separate authorization.',stale:'Fresh configuration readback required before editing.',conflict:'Another tool owns the affected setting. Resolve the conflict; no overwrite.'}[s.access];
let html=`<div class="columns"><div><div class="line spread"><strong>${c.name} · ${c.profile}</strong><small>${c.host}</small></div><div class="fact"><span>Routing</span>${c.cap?`<select aria-label="Routing" data-route ${denied||['review','saved','configured'].includes(phase)?'disabled':''}><option ${d.route==='AgentQ'?'selected':''}>AgentQ</option><option ${d.route==='Direct'?'selected':''}>Direct</option></select>`:`<span class="muted">${c.route}</span>`}</div><small>${i===0?'AgentQ routes the existing provider through its local proxy. Direct keeps MCP and telemetry.':i===1?'Direct removes the owned proxy route; the command hook can still use RTK.':i===2?'Hermes uses its tool-result plugin, not a provider proxy.':'Desktop Chat supports MCP only.'}</small><div class="section"><div class="line spread"><strong>Context optimization</strong>${!chat?`<label><input type="checkbox" data-opt ${d.opt?'checked':''} ${denied||['review','saved','configured'].includes(phase)?'disabled':''}> Enabled</label>`:'<small>Not supported</small>'}</div>${!chat?`<p class="small-label">${c.adapter}</p><small>${i===0&&d.route==='Direct'?'Enabled preference retained, but Direct bypasses the provider adapter.':'Only qualified tool results. Original output is kept on failure; code and complete JSON pass through.'}</small>`:''}</div><div class="section"><div class="line spread"><strong>MCP ${chat?'':'& hooks'}</strong>${btn('setup',d.setup?'Setup selected':'Set up integration')}</div><div class="chips"><span class="chip">agent_context ${c.mcp?'✓':'?'}</span>${chat?'':`<span class="chip">${i===2?'Plugin':'Hooks'} ${c.hooks?'✓':'?'}</span>`}</div><p class="small-label">${chat?'index_document · search_document · get_original':i===2?'MCP + owned agent-context plugin':'MCP + owned lifecycle/tool hooks'}</p><small>Setup reviews only AgentQ-owned changes. Existing trust and unrelated settings are preserved.</small></div>${warning?`<p class="ask">${warning}</p>`:''}`;
if(phase==='review')html+=`<div class="review"><strong>Review · ${c.name} / ${c.host}</strong>${d.route!==c.route?`<p>Routing: ${c.route} → ${d.route}</p>`:''}${d.opt!==c.opt?`<p>Optimization: ${c.opt?'On':'Off'} → ${d.opt?'On':'Off'}</p>`:''}${d.setup?'<p>Register the owned MCP and supported hooks/plugin. Preserve external edits and existing trust.</p>':''}<small>Only this profile. Client login, model, approvals and active conversations stay unchanged. A client reload may be required.</small><div class="line">${btn('apply','Apply reviewed changes',true)}${btn('back','Back')}</div></div>`;
else html+=`<div class="line section">${btn('review','Review changes',true)}${btn('reset','Discard draft')}</div>`;
html+='</div><div><strong>'+icon('circle-check')+' Verification</strong>';
if(phase==='saved')html+='<p class="ask">Accepted · waiting for host readback</p><small>Do not report configured or verified yet.</small><p>'+btn('readback','Simulate host readback')+'</p>';
else if(phase==='configured')html+='<p class="ask">Configured · activity unverified</p><small>Open a new client turn; reload the client if required. Check the selected profile through its actual adapter.</small><p>'+btn('activity','Simulate verified client activity')+'</p>';
else html+=`<p class="${s.activity[i]?'good':'ask'}">${s.activity[i]?'Verified client activity':'Client activity unverified'}</p><small>${s.activity[i]?'Demo observation from this installation and profile.':'A written config or healthy service does not verify the client path.'}</small>`;
html+=`<details class="section"><summary>Managed engines</summary><div class="fact"><span>RTK</span><span>0.51.0 · ready</span></div><div class="fact"><span>headroom</span><span>0.40.0 · ready</span></div><small>Demo pins · managed by the AgentQ release, not selected per client. Host minimum: 2,048 bytes; qualification still determines eligible results.</small></details><details class="section"><summary>Activity & incidents</summary><p>${s.activity[i]?'Last verified activity · demo 40s ago':'Last activity unknown'}</p><small>Active task title / worker progress: not supplied by this AgentQ projection.</small>${i===2&&!c.hooks?'<p class="ask">Plugin missing · integration not verified</p><small>Client work continues without optimization. Review the owned integration setup.</small>':'<p>No incident in this fixture.</p>'}<p class="small-label">Public incident reporting has separate consent; nothing is posted from this demo.</p></details></div></div>`;
root.querySelector('[data-editor]').innerHTML=html;const review=root.querySelector('[data-action="review"]');if(review)review.disabled=!changed||denied||['saved','configured'].includes(phase);const discard=root.querySelector('[data-action="reset"]');if(discard)discard.disabled=phase==='saved';const setup=root.querySelector('[data-action="setup"]');if(setup)setup.disabled=denied||['review','saved','configured'].includes(phase);const apply=root.querySelector('[data-action="apply"]');if(apply)apply.disabled=denied;root.querySelectorAll('button,summary,select').forEach(e=>e.classList.add('cursor-interaction'));globalThis.lucide?.createIcons({attrs:{width:16,height:16}})}
restore(window.openai?.widgetState?.privateContent);paint();root.addEventListener('change',e=>{if(e.target.matches('[data-font]'))s.font=+e.target.value;else if(e.target.matches('[data-access]'))s.access=e.target.value;else if(e.target.matches('[data-route]'))s.drafts[s.selected].route=e.target.value;else if(e.target.matches('[data-opt]'))s.drafts[s.selected].opt=e.target.checked;else return;paint();save()});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.client!==undefined){s.selected=+b.dataset.client;note('');paint();save();return}const i=s.selected,c=s.actual[i],d=s.drafts[i];switch(b.dataset.action){case 'setup':d.setup=!d.setup;break;case 'review':if(s.access!=='allowed')return;s.states[i]='review';break;case 'back':s.states[i]='';break;case 'apply':if(s.access!=='allowed'||s.states[i]!=='review')return;s.states[i]='saved';s.activity[i]=false;note('Demo acknowledgement only; actual configuration still awaits host readback.');break;case 'readback':c.route=d.route;c.opt=d.opt;if(d.setup){c.mcp=true;c.hooks=i!==3}d.setup=false;s.states[i]='configured';note('Demo: owned changes read back; real client path still unverified.');break;case 'activity':s.activity[i]=true;s.states[i]='';note('Demo client activity verified. This is not a measurement of savings.');break;case 'reset':s.drafts[i]={route:c.route,opt:c.opt,setup:false};s.states[i]='';note('Draft discarded.');break;default:return}paint();save()});window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.privateContent;if(v?.v===2&&JSON.stringify(v)!==JSON.stringify(s)){restore(v);paint()}});
})();
</script>
</div>
