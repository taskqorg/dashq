<div id="aqresults">
<style>
#aqresults{--paper:light-dark(#fafbfc,#252b32);--ink:light-dark(#243039,#eef2f5);--secondary:light-dark(#59636e,#b9c3cd);--line:light-dark(#dce0e5,#46505b);--hover:light-dark(#e9edf1,#37424c);--good:light-dark(#246f59,#8dd2b8);--ask:light-dark(#955525,#edbc96);--bad:light-dark(#a6324b,#ee96a5);font:16px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink)}
#aqresults *{box-sizing:border-box}#aqresults .app{background:var(--paper);padding:12px;border-radius:8px}#aqresults .demo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 90px 10px 0;color:var(--secondary);font-size:14px}#aqresults button,#aqresults select{font:inherit;color:inherit;border-radius:5px;padding:4px 6px;min-height:32px;background:transparent;border:0}#aqresults select{border:1px solid var(--line);background:var(--paper);max-width:100%}#aqresults button{cursor:default}#aqresults button:hover,#aqresults button[aria-pressed=true]{background:var(--hover)}#aqresults :focus-visible{outline:2px solid var(--good);outline-offset:2px}#aqresults strong,#aqresults h3{font-weight:500}#aqresults h3{font-size:1em;margin:0 0 8px}#aqresults p{margin:5px 0}#aqresults small{font-size:.85em;color:var(--secondary)}#aqresults .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#aqresults .spread{justify-content:space-between}#aqresults .nums{font-variant-numeric:tabular-nums}#aqresults .good{color:var(--good)}#aqresults .bad{color:var(--bad)}#aqresults .ask{color:var(--ask)}#aqresults .section{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}#aqresults .stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px -6px}#aqresults .stats button{display:flex;gap:8px;align-items:baseline}#aqresults .bar{display:flex;height:7px;background:var(--hover);margin:6px 0}#aqresults .bar span{height:100%}#aqresults .compressed{background:var(--good)}#aqresults .passed{background:var(--secondary);opacity:.55}#aqresults .failed{background:var(--bad)}#aqresults .columns{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}#aqresults .columns>section{min-width:0}#aqresults .history{display:flex;gap:6px;align-items:end;height:100px;margin-top:8px}#aqresults .bucket{flex:1;display:flex;flex-direction:column-reverse;min-width:0;background:transparent;border-radius:0;padding:0;min-height:0}#aqresults .bucket span{width:100%;display:block;min-height:0}#aqresults .scale{display:flex;justify-content:space-between;gap:4px;font-size:.85em;color:var(--secondary)}#aqresults .volume{display:grid;grid-template-columns:4em minmax(0,1fr) 4.7em;gap:6px;align-items:center;margin:7px 0}#aqresults .volume b{display:block;height:12px;background:var(--secondary);opacity:.55}#aqresults .volume .after{background:var(--good);opacity:1}#aqresults .volume strong{text-align:right}#aqresults .coverage{margin-top:7px}#aqresults .rows{display:grid;gap:3px}#aqresults .profile{display:grid;grid-template-columns:minmax(0,1fr) 4em 4em 4em;gap:5px;align-items:center;text-align:left;width:100%}#aqresults .profile span:not(:first-child){text-align:right}#aqresults .profile small{display:block}#aqresults .rowhead{padding:4px 6px;color:var(--secondary);font-size:.85em}#aqresults .detail{padding:8px;background:var(--hover);border-radius:6px;margin-top:8px}#aqresults .detail:empty{display:none}#aqresults .reason{display:grid;grid-template-columns:minmax(0,1fr) 3em;gap:10px}#aqresults .reason span:last-child{text-align:right}#aqresults .effect{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:5px 12px}#aqresults summary{min-height:32px}#aqresults .pill{padding:2px 6px;border-radius:20px;background:var(--hover)}#aqresults [hidden]{display:none!important}@media(max-width:640px){#aqresults .columns{grid-template-columns:1fr}#aqresults .profile{grid-template-columns:minmax(0,1fr) repeat(3,2.8em)}#aqresults .demo{padding-right:0}#aqresults .app{padding:9px}#aqresults .effect{grid-template-columns:minmax(0,1fr) auto auto}}@media(pointer:coarse){#aqresults button,#aqresults select,#aqresults summary{min-height:44px}}
</style>
<div class="demo"><span>Demo · synthetic data</span><label>Source <select data-source><option value="complete">Complete</option><option value="partial">Partial</option><option value="empty">No calls</option></select></label><label>Text <select data-font><option>16</option><option>20</option></select></label></div>
<section class="app">
<header class="line spread"><strong>AgentQ › Results</strong><div class="line"><label>Period <select data-period><option value="30">30 min</option><option value="120">2 hours</option><option value="1440">24 hours</option></select></label><label>Client <select data-client><option value="all">All</option><option value="codex">Codex</option><option value="claude">Claude Code</option><option value="hermes">Hermes</option></select></label></div></header>
<div class="line spread"><small data-window></small><small data-fresh></small></div>
<div data-summary></div>
<div data-detail class="detail" aria-live="polite"></div>
<div class="columns">
<section><div class="line spread"><h3>Calls over time</h3><small data-scale></small></div><div class="history" data-history></div><div class="scale" data-axis></div></section>
<section><div class="line spread"><h3>Tool-result volume</h3><strong class="good nums" data-reduction></strong></div><div data-volume></div><small class="coverage" data-coverage></small></section>
</div>
<section class="section"><div class="line spread"><h3>Clients</h3><button data-all hidden>All clients</button></div><div class="profile rowhead"><span>Profile · recipe</span><span>✓</span><span>↪</span><span>×</span></div><div class="rows" data-profiles></div><small>✓ Compressed · ↪ Passed unchanged · × Optimization failed</small></section>
<section class="section"><details data-whole><summary>Whole-task effect · <span data-effect-title>not measured</span></summary><div data-effect></div><label class="line section"><input type="checkbox" data-paired> Demo: show paired-run evidence</label></details></section>
<details class="section"><summary>Coverage & evidence</summary><div data-evidence></div></details>
</section>
<script>
(()=>{const root=document.getElementById('aqresults');const base=[{id:'codex',name:'Codex',where:'mac · Default',recipe:'Provider · headroom',c:230,p:158,f:12,pairs:220,bin:8,bout:3.2},{id:'claude',name:'Claude Code',where:'fra · Work',recipe:'Native run · RTK',c:290,p:120,f:10,pairs:280,bin:10,bout:4},{id:'hermes',name:'Hermes',where:'fra · Default',recipe:'Plugin · headroom',c:100,p:72,f:8,pairs:100,bin:2,bout:.8}];let s={v:1,period:'30',client:'all',source:'complete',font:16,detail:'',paired:false};const fmt=n=>n.toLocaleString('en-US',{maximumFractionDigits:1});const q=x=>root.querySelector(x);function restore(x){if(x?.v===1){s={...s,...x};if(!['30','120','1440'].includes(s.period))s.period='30';if(!['all',...base.map(x=>x.id)].includes(s.client))s.client='all';if(!['complete','partial','empty'].includes(s.source))s.source='complete';s.font=s.font===20?20:16;}}function save(){window.openai?.setWidgetState({modelContent:{demo:true,period:s.period,client:s.client,source:s.source,detail:s.detail,paired:s.paired},privateContent:s})?.catch(()=>{})}const split=(n,w)=>{const a=w.map(x=>Math.floor(n*x/w.reduce((a,b)=>a+b)));for(let i=0;a.reduce((a,b)=>a+b,0)<n;i++)a[i%a.length]++;return a};function rows(){const k=s.source==='empty'?0:({'30':1,'120':4,'1440':24}[s.period]);return base.filter(x=>(s.client==='all'||s.client===x.id)&&!(s.source==='partial'&&x.id==='hermes')).map(x=>({...x,...Object.fromEntries(['c','p','f','pairs','bin','bout'].map(y=>[y,x[y]*k]))}));}function paint(){root.style.fontSize=s.font+'px';for(const n of ['period','client','source','font'])q('[data-'+n+']').value=s[n];q('[data-paired]').checked=s.paired;const r=rows(),t={c:0,p:0,f:0,pairs:0,bin:0,bout:0};r.forEach(x=>Object.keys(t).forEach(k=>t[k]+=x[k]));const total=t.c+t.p+t.f,partial=s.source==='partial',missing=partial&&s.client==='hermes',prefix=partial?'≥':'';const windowText={'30':'14 Oct · 06:00–06:30','120':'14 Oct · 04:30–06:30','1440':'13 Oct 06:30–14 Oct 06:30'}[s.period];q('[data-window]').textContent=windowText+' · UTC+07';q('[data-fresh]').textContent=partial?'Incomplete · Hermes delivery gap':'Observed through 06:30';q('[data-summary]').innerHTML=`<div class="stats nums">${[['all',total,'Calls',''],['compressed',t.c,'Compressed','good'],['passed',t.p,'Passed',''],['failed',t.f,'Failed','bad']].map(([id,n,label,tone])=>`<button data-outcome="${id}" aria-pressed="${s.detail===id}" class="${tone}"><strong>${missing?'—':prefix+fmt(n)}</strong> ${label}</button>`).join('')}</div><div class="bar" role="img" aria-label="Observed calls: ${t.c} compressed, ${t.p} passed, ${t.f} failed">${[['compressed',t.c],['passed',t.p],['failed',t.f]].map(([cl,n])=>`<span class="${cl}" style="width:${total?n/total*100:0}%"></span>`).join('')}</div>${partial?'<small class="ask">Observed subset only · no complete-period rate</small>':!total?'<small>No calls observed in this window · not a failure</small>':''}`;
let detail='';if(s.detail==='all')detail=`${fmt(total)} distinct core events. Native model requests and MCP retrievals are separate populations.`;if(s.detail==='compressed')detail=`${fmt(t.c)} results compressed; ${fmt(t.pairs)} contain comparable before/after byte measurements. ${fmt(t.c-t.pairs)} lack a paired measurement.`;if(s.detail==='passed'){const ns=split(t.p,[120,60,50,80,20,20]);detail='<strong>Passed unchanged</strong>'+['Short result','Code','Complete JSON','Not qualified','Not smaller','Disabled'].map((v,i)=>`<div class="reason"><span>${v}</span><span>${fmt(ns[i])}</span></div>`).join('')}if(s.detail==='failed'){const ns=split(t.f,[2,1]);detail=`<strong>Optimization failed</strong><div class="reason"><span>Timeout</span><span>${fmt(ns[0])}</span></div><div class="reason"><span>Engine error</span><span>${fmt(ns[1])}</span></div><small>Original result preserved in this fixture. This is not a count of failed agent tasks.</small>`}q('[data-detail]').innerHTML=detail;
const c=split(t.c,[70,90,110,120,110,120]),p=split(t.p,[40,50,60,60,70,70]),f=split(t.f,[2,3,5,6,7,7]),max=Math.max(1,...c.map((x,i)=>x+p[i]+f[i]));q('[data-scale]').textContent=total?'0–'+fmt(max)+' calls / bin':'No samples';q('[data-history]').innerHTML=c.map((x,i)=>`<button class="bucket" data-bin="${i}" aria-label="Bin ${i+1}: ${x} compressed, ${p[i]} passed, ${f[i]} failed" data-tooltip="${x} compressed · ${p[i]} passed · ${f[i]} failed" style="height:${(x+p[i]+f[i])/max*100}%"><span class="compressed" style="height:${x/(x+p[i]+f[i]||1)*100}%"></span><span class="passed" style="height:${p[i]/(x+p[i]+f[i]||1)*100}%"></span><span class="failed" style="height:${f[i]/(x+p[i]+f[i]||1)*100}%"></span></button>`).join('');q('[data-axis]').innerHTML=`<span>${s.period==='30'?'06:00':s.period==='120'?'04:30':'Yesterday 06:30'}</span><span>${s.period==='30'?'5 min':s.period==='120'?'20 min':'4 h'} bins</span><span>06:30</span>`;
q('[data-reduction]').textContent=t.bin?'−'+fmt((1-t.bout/t.bin)*100)+'%':'—';q('[data-volume]').innerHTML=t.bin?`<div class="volume"><small>Before</small><b></b><strong>${fmt(t.bin)} MiB</strong></div><div class="volume"><small>After</small><div><b class="after" style="width:${t.bout/t.bin*100}%"></b></div><strong>${fmt(t.bout)} MiB</strong></div><div class="line spread"><span>${fmt(t.bin-t.bout)} MiB less</span><small>Paired bytes · includes recovery hint</small></div>`:'<p>— No paired measurements</p>';q('[data-coverage]').textContent=`${fmt(t.pairs)} / ${fmt(t.c)} observed compressed calls measured${partial?' · incomplete period':''}. Byte reduction is not token or cost savings.`;
q('[data-profiles]').innerHTML=r.map(x=>`<button class="profile nums" data-profile="${x.id}" aria-pressed="${s.client===x.id}"><span>${x.name}<small>${x.where} · ${x.recipe}</small></span><span class="good">${fmt(x.c)}</span><span>${fmt(x.p)}</span><span class="bad">${fmt(x.f)}</span></button>`).join('')+(partial&&(s.client==='all'||s.client==='hermes')?'<div class="profile"><span>Hermes<small>Delivery gap · unknown</small></span><span>—</span><span>—</span><span>—</span></div>':'');q('[data-all]').hidden=s.client==='all';q('[data-effect-title]').textContent=s.paired?'separate paired experiment':'not measured';q('[data-effect]').innerHTML=s.paired?'<p>Demo experiment · 8 matched tasks · same recipe and model</p><div class="effect nums"><small>Observed</small><small>Baseline</small><small>Optimized</small><span>Quality checks</span><span>8 / 8</span><span>8 / 8</span><span>Input tokens</span><span>1.60M</span><span>1.36M</span><span>Output tokens</span><span>240k</span><span>260k</span><span>Attempts</span><span>10</span><span>10</span><span>Wall time</span><span>42 min</span><span>41 min</span><span>Reported cost · USD</span><span>$8.40</span><span>$7.90</span></div><p>−$0.50 (6%) on these runs</p><small>Paired-run evidence is separate from the selected period. Includes retries and retrieval. Not a subscription saving or fleet-wide estimate; larger-sample confidence is unknown.</small>':'<p>Tokens saved — · cost saved — · quality impact —</p><small>No comparable whole-task runs. Current usage alone cannot establish savings.</small>';
q('[data-evidence]').innerHTML=`<p>${partial?'2 / 3':'3 / 3'} installations reporting in the demo window · ${fmt(total)} visible events</p><p>Deduplicated by event ID; compressed, passed and failed are disjoint. Missing clients stay unknown.</p><p>Byte comparison: same calls, before vs delivered result. Native RTK and headroom remain separate recipes.</p><p>Token estimates, if available, are labelled estimates and excluded from observed model usage.</p><small>Synthetic metadata only · no prompts, commands or raw results. A real view needs AgentQ schema/version and trace references.</small>`;root.querySelectorAll('button,select,summary').forEach(e=>e.classList.add('cursor-interaction'));}
root.addEventListener('change',e=>{for(const k of ['period','client','source','font'])if(e.target.matches('[data-'+k+']'))s[k]=k==='font'?+e.target.value:e.target.value;if(e.target.matches('[data-paired]'))s.paired=e.target.checked;paint();save()});root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.outcome)s.detail=s.detail===b.dataset.outcome?'':b.dataset.outcome;if(b.dataset.profile)s.client=b.dataset.profile;if(b.hasAttribute('data-all'))s.client='all';if(b.dataset.bin!==undefined){q('[data-detail]').textContent=b.getAttribute('aria-label');return}paint();save()});restore(window.openai?.widgetState?.privateContent);paint();window.addEventListener('openai:set_globals',e=>{const x=e.detail?.globals?.widgetState?.privateContent;if(x?.v===1&&JSON.stringify(x)!==JSON.stringify(s)){restore(x);paint()}});
})();
</script>
</div>
