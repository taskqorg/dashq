<script>
(()=>{

const preview={platform:'fra/native'};

const questions={

const hosts=[{id:'fra/native',cpu:34,ram:21.4,total:32,run:3,cap:6,disks:[['/',57,80],['/data',91,400]],curve:[18,20,17,26,22,24,19,32,35,27,23,29,31,26,34],mem:[58,58,60,61,60,61,62,62,63,64,64,65,66,66,66.875]},

{id:'windows/native',cpu:62,ram:28.2,total:32,run:4,cap:8,disks:[['C:',72,1000],['D:',41,2000]],curve:[32,38,35,44,51,48,55,53,65,71,61,68,58,66,62],mem:[58,60,64,66,69,71,73,75,78,81,83,85,86,87,88.125]},

const policies=hosts.map(h=>({mode:'Auto',max:String(h.cap),project:'',runtime:'',window:'1',pressure:'Healthy'}));
let selected=0,font=16;let s={resources:policies[0],resourceDraft:null,scope:'rule',scopeDraft:'Work on the admin API, exclude billing. Keep agentq on docs.'};
function counts(project=''){const data=project?projectCounts[project]:[2,1,2,1,9,2,2,186],items=[['Doing','play','good'],['Review','git-pull-request',''],['Human','message-circle-question','ask'],['Failed','circle-x','danger'],['Ready','circle',''],['Blocked','link',''],['Later','clock',''],['Closed','check','quiet']].map(([n,i,c],j)=>data[j]===0?'':`<button class="${c}" data-action="tasks" data-project="${project}" data-value="${n}" aria-label="${project?project+' · ':''}${n}: ${data[j]??'unknown'}" data-tooltip="${n}: ${data[j]??'unknown'}">${icon(i)} ${data[j]??'?'}</button>`).join('');return items?`<div class="counts" aria-label="${project||'All projects'} counters">${items}</div>`:''}
function resourceEditor(s){const x=s.resourceDraft||s.resources;return `<div class="divider"><div class="line spread"><strong>Resources · ${preview.platform}</strong><small>3 managed sessions</small></div><div class="line"><label>Mode <select data-resource="mode"><option ${x.mode==='Auto'?'selected':''}>Auto</option><option ${x.mode==='Fixed'?'selected':''}>Fixed</option></select></label><label>Maximum <input data-resource="max" aria-label="Host maximum sessions" type="number" min="0" step="1" placeholder="No cap" value="${esc(x.max)}" style="width:100px"></label></div><small>${x.mode==='Auto'?'Admit gradually while the machine has headroom. Optional caps only narrow admission.':'Fixed ceiling. Automatic load protection is off; active work is preserved.'}</small><details><summary>Project, runtime & measurement</summary><div class="line"><label>taskq max <input data-resource="project" aria-label="Project maximum sessions" type="number" min="0" step="1" value="${esc(x.project)}" placeholder="No cap" style="width:100px"></label><label>Codex max <input data-resource="runtime" aria-label="Runtime maximum sessions" type="number" min="0" step="1" value="${esc(x.runtime)}" placeholder="No cap" style="width:100px"></label></div><label>Load window <select data-resource="window" ${x.mode==='Fixed'?'disabled':''}>${['1','5','10','15'].map(v=>`<option value="${v}" ${x.window===v?'selected':''}>${v} min</option>`).join('')}</select></label><p>All other hosts and overrides stay unchanged. Zero disables new starts for that target.</p><small>Fixture telemetry: ${x.pressure==='Stale metrics'?'readings unavailable · last sample 2 minutes ago':x.pressure==='Memory pressure'?'CPU 42% · available RAM 9% · updated 10s ago':'CPU 42% · available RAM 38% · updated 10s ago'}. Timing and thresholds need hardware qualification.</small></details><div class="line demo-resource"><small>Preview load</small><select data-resource="pressure" aria-label="Preview host load">${['Healthy','Memory pressure','Stale metrics'].map(v=>`<option ${x.pressure===v?'selected':''}>${v}</option>`).join('')}</select></div></div>`}
function work(s){return `<strong>Work mode</strong><div class="line"><small>${preview.platform} · selected projects</small></div><div class="section"><label><input type="checkbox" checked disabled>taskq</label><label><input type="checkbox" checked disabled>agentq</label><small>Other projects remain unchanged.</small></div><div class="composer"><textarea aria-label="Requested scope" data-scope-draft>${esc(s.scopeDraft)}</textarea></div><div class="line">${button('rule','Future matches','','', 'rule')}${button('rule','Selected tasks','','','snapshot')}</div><div class="section divider"><strong>${s.scope==='rule'?'Rule · includes future matches':'Snapshot · 4 selected tasks'}</strong><p>taskq: admin AND NOT billing<br>agentq: docs</p><small>4 match · 7 excluded · 1 dependency outside scope</small></div>${resourceEditor(s)}<div class="line divider">${button('scope-review','Review changes','check','primary')}${button('resource-cancel','Cancel')}</div>`}
function scopeReview(s){const x=s.resourceDraft||s.resources;return `<strong>Review work mode</strong><div class="review"><p>taskq: All → Admin, excluding billing</p><p>agentq: Docs → Docs</p><p>${s.scope==='rule'?'Future matching tasks included.':'Only the selected 4 tasks included.'}</p><small>Current attempts continue.</small></div><div class="review"><strong>Resources · ${preview.platform}</strong><p>${esc(s.resources.mode)} → ${esc(x.mode)} · host max ${s.resources.max||'none'} → ${x.max||'none'}</p><p>taskq max ${s.resources.project||'none'} → ${x.project||'none'} · Codex max ${s.resources.runtime||'none'} → ${x.runtime||'none'}</p><small>${x.mode==='Auto'?`Observe ${x.window} minute(s); latest unhealthy sample blocks new starts.`:'Load protection off. Count ceilings still apply.'} Other hosts and unchanged settings are preserved.</small></div><div class="review"><strong class="ask">Dependency outside scope</strong><p>#812 · Shared authentication</p><small>Excluded. Dependent task stays blocked.</small></div>${button('scope-apply','Apply these changes','check','primary')}${button('work','Back')}`}
function question(key){const q=questions[key],ordinary=q.state==='Open';return `<div class="qcard" data-question="${key}"><div class="line"><span class="ask">?</span><button data-action="issue" class="link">#${q.issue}</button><small>taskq · Codex</small></div><strong>${q.title}</strong><p>${q.why}</p>${ordinary?`<div class="qchoices">${q.options.map((text,j)=>`<button data-q="answer" data-key="${key}" data-option="${j}" data-revision="${q.revision}"><span class="qnumber">${j+1}.</span><span>${esc(text)}</span></button>`).join('')}</div><details><summary>Other answer</summary><textarea data-qtext="${key}" aria-label="Answer for ${q.issue}" placeholder="Your answer…">${esc(q.draft)}</textarea><button data-q="custom" data-key="${key}" data-revision="${q.revision}">Send answer</button></details>`:q.state==='Recorded'?`<p class="qreceipt">Recorded: ${q.answerNumber?`${q.answerNumber}. `:""}${esc(q.answer)}</p><small>Board acknowledgement simulated. Agent resumption is not yet verified.</small>`:q.state==='Sending'?'<p>Sending… choices locked</p>':q.state==='Changed'?`<p class="ask">Question changed. Your previous choice was not sent.</p><button data-q="reload" data-key="${key}">Load current question</button>`:q.state==='Unknown'?`<p>Delivery unknown. Do not resend.</p><button data-q="check" data-key="${key}">Check answer status</button>`:`<p>Rejected before write. Draft preserved.</p><button data-q="reload" data-key="${key}">Retry answer</button>`}<details><summary>Checked & context</summary><small>${q.checked}</small><button data-q="discuss" data-key="${key}">Discuss with AI</button></details><div class="qdemo"><label>Preview answer state <select data-qstatus="${key}">${['Open','Sending','Recorded','Changed','Failed','Unknown'].map(s=>`<option ${q.state===s?'selected':''}>${s}</option>`).join('')}</select></label></div></div>`}
function save(){window.openai?.setWidgetState({modelContent:{demo:true,selected:hosts[selected].id,answers:Object.fromEntries(Object.entries(questions).map(([k,q])=>[k,q.answer||null]))},privateContent:{version:2,questions,policies,selected,font}})?.catch(()=>{});}
function restore(v){if(v?.version!==2)return;Object.keys(questions).forEach(k=>{if(v.questions?.[k])Object.assign(questions[k],v.questions[k]);});if(v.policies)policies.splice(0,policies.length,...v.policies);selected=v.selected||0;font=v.font||16;s.resources=policies[selected];}
restore(window.openai?.widgetState?.privateContent);
function graph(v,label,warn=false){return `<svg class="spark ${warn?'warning':''}" viewBox="0 0 160 32" preserveAspectRatio="none" role="img" aria-label="${label}: 30 minutes, zero to one hundred percent"><line x1="0" x2="160" y1="2" y2="2"/><line x1="0" x2="160" y1="30" y2="30"/><polyline points="${v.map((n,i)=>`${i*160/(v.length-1)},${30-n*.28}`).join(' ')}"/></svg>`;}
function meter(p,label){return `<div class="meter" role="meter" aria-label="${label}" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><span class="${p>=90?'failure':p>=85?'warning':''}" style="width:${p}%"></span></div>`;}
function drawHosts(){root.querySelector('[data-hosts]').innerHTML=hosts.map((h,i)=>`<article class="node"><div class="line spread"><strong>${h.id}</strong><button type="button" data-node="${i}" aria-label="Work mode for ${h.id}">${icon('focus')} ${policies[i].mode} · ${h.run}${policies[i].max===''?'':' / '+policies[i].max}</button></div><div class="metrics num"><div><span class="mobile-label">CPU </span>${h.cpu}%${graph(h.curve,h.id+' CPU')}</div><div><span class="mobile-label">RAM GiB </span><span class="${h.ram/h.total>=.85?'ask':''}">${h.ram} / ${h.total}</span> <small>${Math.round(h.ram/h.total*100)}%</small>${meter(h.ram/h.total*100,'RAM '+h.id)}${graph(h.mem,h.id+' RAM',h.ram/h.total>=.85)}</div><div class="disks">${h.disks.map(([n,p,t])=>`<div class="disk"><div><span>${n}</span><small class="${p>=90?'danger':''}">${Math.round(p*t/100)} / ${t}<span class="mobile-label"> GiB</span></small></div>${meter(p,h.id+' '+n)}</div>`).join('')}</div></div></article>`).join('');}
function boardQuestion(key){return question(key).replace('<small>taskq · Codex</small>',`<small>${key==='2201'?'agentq':'taskq'} · demo task</small>`).replace('<span class="ask">?</span>',`<span class="ask">${icon('message-circle-question')}</span>`).replace('<button data-action="issue" class="link">', '<button data-action="demo-issue" class="link" aria-label="Synthetic issue; no live issue exists">');}
function drawBoards(){const aggregate=Array.from({length:8},(_,i)=>i>=6?null:Object.values(projectCounts).filter(Boolean).reduce((a,c)=>a+c[i],0));root.querySelector('[data-aggregate]').innerHTML=countsFrom(aggregate,'All available boards');root.querySelector('[data-boards]').innerHTML=Object.entries(projectCounts).map(([p,c])=>`<article class="board" data-project="${p}"><div class="project-row"><a href="https://github.com/taskqorg/${p}/issues" target="_blank" rel="noopener" aria-label="Open ${p} board"><span class="provider" aria-hidden="true"></span><strong>${p}</strong></a>${c?'':'<small>No access</small>'}${c?counts(p):''}</div>${c?`<div class="meter queue" role="img" aria-label="Open queue composition, common scale ten tasks">${c.slice(0,7).map((n,i)=>n?`<span class="${['doing','','human','failed'][i]||''}" style="width:${n*10}%"></span>`:'').join('')}</div>`:''}<div data-filter="${p}"></div>${p==='taskq'?`${boardQuestion('1201')}<details><summary>${icon('message-circle-question')} #1202 · History period</summary>${boardQuestion('1202')}</details><details><summary class="danger">${icon('circle-x')} #1203 · Windows release</summary><p>Signature verification failed; release not published.</p></details>`:p==='agentq'?`<details><summary>${icon('message-circle-question')} #2201 · History retention</summary>${boardQuestion('2201')}</details>`:''}</article>`).join('');}
function countsFrom(data,label){const old=projectCounts.__aggregate;projectCounts.__aggregate=data;const html=counts('__aggregate').replaceAll('__aggregate',label);delete projectCounts.__aggregate;return html;}
function icons(){root.querySelectorAll('button,summary,a').forEach(e=>e.classList.add('cursor-interaction'));globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}
function paint(){root.style.fontSize=font+'px';drawHosts();drawBoards();icons();}
function workPaint(review=false){preview.platform=hosts[selected].id;root.querySelector('[data-work-host]').textContent=preview.platform+' · demo';root.querySelector('[data-work-body]').innerHTML=(review?scopeReview(s):work(s)).replace('3 managed sessions',hosts[selected].run+' managed sessions');icons();}
function notice(t){root.querySelector('.dash-notice').textContent=t;}
function answer(q,text,n){if(q.state!=='Open'||!text.trim())return;q.state='Recorded';q.answer=text;q.answerNumber=n;drawBoards();icons();save();notice('Answer recorded in demo; source counters await the next snapshot.');}
root.addEventListener('input',e=>{if(e.target.dataset.qtext){questions[e.target.dataset.qtext].draft=e.target.value;save();}if(e.target.matches('[data-scope-draft]'))s.scopeDraft=e.target.value;if(e.target.dataset.resource){s.resourceDraft={...(s.resourceDraft||s.resources),[e.target.dataset.resource]:e.target.value};}});
root.addEventListener('change',e=>{if(e.target.dataset.resource){s.resourceDraft={...(s.resourceDraft||s.resources),[e.target.dataset.resource]:e.target.value};if(e.target.dataset.resource==='mode')workPaint();}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.node!==undefined){selected=+b.dataset.node;s.resources=policies[selected];s.resourceDraft=null;root.querySelector('[data-work]').hidden=false;workPaint();root.querySelector('[data-work]').scrollIntoView({block:'start'});save();return;}
if(b.hasAttribute('data-close-work')){root.querySelector('[data-work]').hidden=true;root.querySelector(`[data-node="${selected}"]`).focus();return;}
if(b.hasAttribute('data-attention')){root.querySelector('[data-question="1201"]').scrollIntoView({block:'nearest'});return;}
if(b.dataset.q){const q=questions[b.dataset.key];if(b.dataset.q==='answer')answer(q,q.options[+b.dataset.option],+b.dataset.option+1);else if(b.dataset.q==='custom')answer(q,q.draft,null);else if(b.dataset.q==='discuss')notice('Demo: AI discussion is not connected; your answer stays unchanged.');return;}
const a=b.dataset.action;if(a==='tasks'){const p=b.dataset.project;const target=root.querySelector(`[data-filter="${p}"]`);const text=`${b.dataset.value} · ${p||'all boards'} · demo snapshot`;if(target){target.className='filter-list';target.textContent=text+'. '+(b.dataset.value==='Human'?'Questions below.':'Detailed task records are not included in this fixture.');}else notice(text);return;}
if(a==='demo-issue'){notice('Synthetic task: no live issue link.');return;}
if(a==='rule'){s.scope=b.dataset.value;workPaint();return;}
if(a==='scope-review'){if(![...root.querySelectorAll('[data-resource]')].every(x=>x.checkValidity())){notice('Use a whole number from zero, or leave the cap empty.');return;}if(s.scopeDraft!=='Work on the admin API, exclude billing. Keep agentq on docs.'){notice('Live scope interpretation is unavailable in this demo; draft retained.');return;}workPaint(true);return;}
if(a==='scope-apply'){policies[selected]={...(s.resourceDraft||s.resources)};s.resources=policies[selected];s.resourceDraft=null;drawHosts();workPaint();save();notice('Work mode applied in demo only. Running attempts continue.');return;}
if(a==='work'){workPaint();return;}if(a==='resource-cancel'){s.resourceDraft=null;root.querySelector('[data-work]').hidden=true;notice('Cancelled; settings unchanged.');return;}
});
paint();window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.privateContent;if(v?.version===2&&JSON.stringify(v.questions)!==JSON.stringify(questions)){restore(v);paint();}});
if(globalThis.Tweak){const tstate={font};const t=new Tweak({container:root,onChange:()=>{font=tstate.font;root.style.fontSize=font+'px';save();}});t.addSlider(tstate,'font',{label:'Text size',min:16,max:20,step:2,unit:'px'});}
})();
</script>
</div>
<style>
#tqnext .scenario{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 90px 10px 0;border-bottom:1px solid var(--line)}#tqnext .startup{padding:24px 4px;max-width:640px}#tqnext .startup p{margin:8px 0}#tqnext .source-state{padding:6px 2px;color:var(--secondary)}#tqnext .historical .spark polyline{stroke:var(--secondary);stroke-dasharray:3 3}#tqnext .historical .meter span{background:var(--secondary)}#tqnext .historical{color:var(--secondary)}#tqnext fieldset{border:0;padding:0;margin:0;min-width:0}#tqnext .startup button{background:var(--hover);margin:4px 4px 4px 0}#tqnext .receipt{padding:8px 0;border-top:1px solid var(--line)}#tqnext .receipt:empty{display:none}
</style>
<script>
(()=>{
const root=document.getElementById('tqnext');
root.querySelector('.dash-head small').textContent='Demo data · no live actions';
const controls=document.createElement('div');controls.className='scenario';controls.innerHTML='<span>Demo</span><label>Scenario <select data-scenario><option value="first">First launch</option><option value="pending">Approved · awaiting data</option><option value="taskq">TaskQ only</option><option value="warmup">History warming up</option><option value="partial">Partial outage</option><option value="offline">All sources unavailable</option><option value="recovered">Connection restored</option></select></label>';
root.prepend(controls);
const intro=document.createElement('section');intro.className='startup';intro.setAttribute('aria-label','Connect services');intro.innerHTML='<strong>No services connected</strong><p>Connect the service you already use.</p><button data-connect="TaskQ">TaskQ</button><button data-connect="AgentQ">AgentQ</button><button data-connect="ServerQ">ServerQ</button><div data-enrollment></div>';root.querySelector('.dash-head').after(intro);
const status=document.createElement('div');status.className='source-state';status.setAttribute('role','status');root.querySelector('.dash-head').after(status);
const receipt=document.createElement('div');receipt.className='receipt';receipt.setAttribute('role','status');root.append(receipt);
const saved=window.openai?.widgetState?.privateContent?.outage;
let state=saved?.state||'first',product=saved?.product||'TaskQ';
const pick=root.querySelector('[data-scenario]'),hosts=root.querySelector('[data-hosts]'),boards=root.querySelector('[data-boards]'),columns=root.querySelector('.dash-columns'),attention=root.querySelector('.dash-attention');
const originalAttention=attention.innerHTML;const agg=root.querySelector('[data-aggregate]');const originalAgg=agg.innerHTML;
const hostSection=hosts.closest('section'),boardSection=boards.closest('section');
for(const b of boards.querySelectorAll('.board')){const n=document.createElement('small');n.className='source-state';n.dataset.age='';b.prepend(n);}
function save(){const draft=Object.fromEntries([...root.querySelectorAll('[data-qtext]')].map(x=>[x.dataset.qtext,x.value]));window.openai?.setWidgetState({modelContent:{demo:true,scenario:state},privateContent:{outage:{state,product,draft}}})?.catch(()=>{});}
function paint(){pick.value=state;const empty=['first','pending'].includes(state),offline=state==='offline',partial=state==='partial',taskonly=state==='taskq',warm=state==='warmup';intro.hidden=!empty;columns.hidden=empty;attention.hidden=empty;root.querySelector('.source-note').hidden=empty;root.querySelector('.node-caption').hidden=taskonly;hostSection.hidden=taskonly;boardSection.hidden=warm;columns.style.gridTemplateColumns=(taskonly||warm)?'1fr':'';
intro.querySelector('strong').textContent=state==='pending'?product+' · approved':'No services connected';intro.querySelector('p').textContent=state==='pending'?'Waiting for the first verified snapshot.':'Connect the service you already use.';intro.querySelectorAll('[data-connect]').forEach(b=>b.hidden=state==='pending');intro.querySelector('[data-enrollment]').innerHTML=state==='pending'?'<p>✓ Approval received → ◷ First snapshot</p><small>No data yet · automatic retry</small>':'';
status.textContent=empty?'':taskonly?'TaskQ connected · AgentQ and ServerQ not configured':warm?'AgentQ · fresh sample · history 1 / 3':offline?'Sources unavailable · last known data 12 min ago · retrying automatically':partial?'Partial · TaskQ/taskq 12 min old · ServerQ 7 min old': 'Fresh snapshots received · pending questions revalidated';
attention.innerHTML=empty?'':taskonly?'<strong>Attention</strong><span class="ask">3 questions</span>':warm?'<strong>Attention</strong><span>No incidents reported · ServerQ not configured</span>':offline?'<strong>Attention</strong><span class="ask">Current state unknown · 2 last-known warnings</span>':partial?'<strong>Attention</strong><span class="ask">fra /data · last check 7 min ago · recovery unverified</span><span>3 last-known questions</span>':originalAttention;
hosts.classList.toggle('historical',offline);hostSection.querySelector('.dash-title small').textContent=offline?'Last sample 12 min ago · 30 min history':warm?'1 sample · no history yet':'AgentQ · sample 8s ago · 30 min';hosts.querySelectorAll('.spark').forEach(x=>x.hidden=warm);root.querySelectorAll('[data-node]').forEach(b=>b.disabled=offline||warm);root.querySelector('[data-work]').hidden=true;
for(const b of boards.querySelectorAll('.board')){if(!b.querySelector('[data-age]')){const a=document.createElement('small');a.dataset.age='';a.className='source-state';b.prepend(a);}const p=b.dataset.project,stale=offline||(partial&&p==='taskq');b.classList.toggle('historical',stale);b.querySelector('[data-age]').textContent=p==='specq'?'Never received · unknown':stale?'Last known · 12 min ago':'Snapshot 8s ago';b.querySelectorAll('[data-q],[data-qtext]').forEach(x=>{x.disabled=stale;});}
agg.innerHTML=(offline||partial)?'<div class="line spread"><span>'+(offline?'No current totals':'Current totals incomplete')+'</span><span>?</span></div>':originalAgg;
boardSection.querySelector('.dash-title small').textContent=offline?'0 / 6 current':partial?'4 / 6 current · stale excluded':'5 / 6 current · specq unavailable';root.querySelector('.source-note').textContent='Queue bars: 10 tasks · per-board observation times above';receipt.textContent=(partial||offline)?'Stale TaskQ cards are read-only. Drafts stay here; other fresh boards remain usable.':state==='recovered'?'Connection restored does not resolve the disk incident. A fresh ServerQ check must confirm recovery.':'';globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}
pick.addEventListener('change',()=>{state=pick.value;paint();save();});intro.addEventListener('click',e=>{const b=e.target.closest('[data-connect]');if(!b)return;product=b.dataset.connect;intro.querySelector('[data-enrollment]').innerHTML='<p>'+product+' → this workspace</p><small>Demo enrollment · observation only · no command executed</small><p><button data-approve>Simulate owner approval</button></p>';});intro.addEventListener('click',e=>{if(e.target.closest('[data-approve]')){state='pending';paint();save();}});
root.addEventListener('input',e=>{if(e.target.matches('[data-qtext]'))save();});root.addEventListener('click',e=>{if(e.target.closest('[data-q]'))paint();});
function restore(v){if(!v)return;state=v.state||'first';product=v.product||'TaskQ';paint();for(const [k,x] of Object.entries(v.draft||{})){const el=root.querySelector('[data-qtext="'+k+'"]');if(el)el.value=x;}}
restore(saved);paint();window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState?.privateContent?.outage));
})();
</script>
