[package]
name = "dashq"
version = "0.18.4"
edition = "2024"
publish = false

[dependencies]
coreq = { git = "https://github.com/taskqorg/coreq", tag = "v0.23.4" }
agentq-runtime = { git = "https://github.com/taskqorg/agentq", rev = "c019708aa3d3c03bb372303199857e3047b0c1f6" }
flate2 = "1"
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
