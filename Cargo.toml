[package]
name = "dashq"
version = "0.18.0"
edition = "2024"
publish = false

[dependencies]
coreq = { git = "https://github.com/taskqorg/coreq", tag = "v0.11.0" }
flate2 = "1"
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
