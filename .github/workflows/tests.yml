name: tests
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    # Pinned: Playwright 1.56.1 cannot install chromium on ubuntu-latest 26.04 (#210).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/resources.cjs
      - name: cargo checks
        run: |
          DASHQ_HOST_OBSERVATIONS_EVIDENCE="$RUNNER_TEMP/host-observations" DASHQ_HOST_FIRST_EVIDENCE="$RUNNER_TEMP/host-first" DASHQ_FINDINGS_EVIDENCE="$RUNNER_TEMP/findings" DASHQ_RESOURCE_EVIDENCE="$RUNNER_TEMP/resources.html" DASHQ_STARTUP_EVIDENCE="$RUNNER_TEMP/startup" DASHQ_LIMITS_EVIDENCE="$RUNNER_TEMP/limits.html" cargo test --locked
          cargo run -- selftest
      - name: shared resource browser chain
        run: |
          npm install --prefix "$RUNNER_TEMP/resource-browser" playwright@1.56.1 --no-audit --no-fund
          export NODE_PATH="$RUNNER_TEMP/resource-browser/node_modules"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/resource-browsers"
          "$RUNNER_TEMP/resource-browser/node_modules/.bin/playwright" install --with-deps chromium
          DASHQ_RESOURCE_EVIDENCE="$RUNNER_TEMP/resources.html" node tests/resources-browser.cjs
          DASHQ_STARTUP_EVIDENCE="$RUNNER_TEMP/startup" node tests/startup-browser.cjs
          DASHQ_FINDINGS_EVIDENCE="$RUNNER_TEMP/findings" node tests/findings-browser.cjs
          DASHQ_LIMITS_EVIDENCE="$RUNNER_TEMP/limits.html" node tests/limits-browser.cjs
          DASHQ_HOST_FIRST_EVIDENCE="$RUNNER_TEMP/host-first" node tests/host-first-browser.cjs
          DASHQ_HOST_OBSERVATIONS_EVIDENCE="$RUNNER_TEMP/host-observations" node tests/host-observations-browser.cjs
          node tests/task-controls-browser.cjs
          node tests/workspace-browser.cjs
